[package]
name = "soulmd-agentfi-contract"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
near-sdk = { version = "5.2", features = ["legacy"] }
borsh = "1.6"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = false
rpath = false
debug-assertions = false
